name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Upload and deploy live in separate jobs: deploy-pages in the same job
  # intermittently fails to see the artifact it just uploaded (actions/deploy-pages#451).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assemble the deploy artifact
        run: |
          mkdir -p /tmp/_site
          # Exclusion-based assembly: everything deploys except authoring
          # machinery, so new package trees are never silently dropped.
          rsync -a ./ /tmp/_site/ \
            --exclude .git/ \
            --exclude .github/
          touch /tmp/_site/.nojekyll
      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/_site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
